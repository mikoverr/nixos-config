# Kitty Configuration
# Author: miko
# GitHub: https://github.com/mikoverr

confirm_os_window_close 0
hide_window_decorations yes
cursor_shape block
sync_to_monitor yes
cursor_trail 3

font_size 10
font_family JetBrainsMono Nerd Font

window_padding_width 3 3

# Disable the default ctrl+shift+l binding to avoid conflict with zshrc clear screen shortcut
map ctrl+shift+l no_op

# Graphite Dark Palette
background            #202020
foreground            #e0e0e0
cursor                #e0e0e0
cursor_text_color     #202020
selection_background  #3c3c3c
selection_foreground  #ffffff

# Black / Dark Grey
color0  #242424
color8  #525252

# Red
color1  #f28b82
color9  #f6aea9

# Green
